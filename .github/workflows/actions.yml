name: actions

# The composite actions in actions/ carry typed Python helpers. This workflow
# holds them to ruff, ty, pytest and their doctests, then runs the build-tmux
# and check-example-width actions on a hosted runner, which no unit test can
# stand in for.
on:
  push:
    branches: [main]
    paths: [actions/**, pyproject.toml, .github/workflows/actions.yml]
  pull_request:
    paths: [actions/**, pyproject.toml, .github/workflows/actions.yml]
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull request run is not worth finishing. A push to main keeps
# its own group, so consecutive pushes never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The native tests start a real tmux. Installing it with the repository's
      # own action also exercises that action on every change.
      - name: Install tmux
        uses: ./actions/apt-get
        with:
          update: "true"
          args: install --yes tmux

      # pip 25.1 installs a dependency group; the runner's pip is older.
      - name: Install the checks
        run: |
          python3 -m venv "$RUNNER_TEMP/checks"
          "$RUNNER_TEMP/checks/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/checks/bin/python" -m pip install --quiet --group dev
          echo "$RUNNER_TEMP/checks/bin" >> "$GITHUB_PATH"

      - run: ruff format --check
      - run: ruff check
      - run: ty check
      - name: Run the tests and doctests
        run: pytest

  integration:
    name: Build tmux ${{ matrix.tmux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest tmux the ports commonly test.
        tmux: ["3.3a", "3.8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build tmux ${{ matrix.tmux }}
        id: tmux
        uses: ./actions/build-tmux
        with:
          ref: ${{ matrix.tmux }}

      - name: Check what the action reports
        env:
          BINARY: ${{ steps.tmux.outputs.binary }}
          PREFIX: ${{ steps.tmux.outputs.prefix }}
          VERSION: ${{ steps.tmux.outputs.version }}
          SOURCE: ${{ steps.tmux.outputs.source }}
          EXPECTED: ${{ matrix.tmux }}
        run: |
          test "$("$BINARY" -V)" = "tmux $EXPECTED"
          test "$VERSION" = "$EXPECTED"
          test "$BINARY" = "$PREFIX/bin/tmux"
          pinned=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' \
            actions/build-tmux/tmux-releases.json "$EXPECTED")
          test "$SOURCE" = "$pinned"

      - name: Install the checks
        run: |
          python3 -m venv "$RUNNER_TEMP/checks"
          "$RUNNER_TEMP/checks/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/checks/bin/python" -m pip install --quiet --group dev

      # The cache regression tests run against the tmux this job built, so a
      # validation that would accept a broken build fails here.
      - name: Run the native tests against tmux ${{ matrix.tmux }}
        env:
          TMUX_BINARY: ${{ steps.tmux.outputs.binary }}
        run: |
          "$RUNNER_TEMP/checks/bin/pytest" -m native actions/build-tmux

  example-width:
    name: Run the check-example-width action
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A repository whose one example fits, then the same repository with a
      # wide line added. The action must pass the first and fail the second: an
      # action wired to do nothing would pass both.
      - name: Create a repository to check
        run: |
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/.github"
          cd "$fixture"
          git init --quiet
          printf '%s\n' \
            'markdown = ["**/*.md"]' \
            'shared_digest = "missing"' \
            'allow_ceiling = 0' > .github/example-width.toml
          printf '%s\n' '```sh' 'ls' '```' > README.md
          git add --all

      - name: The action passes a repository whose examples fit
        uses: ./actions/check-example-width
        with:
          root: ${{ runner.temp }}/fixture

      - name: Add a wide example
        run: |
          cd "$RUNNER_TEMP/fixture"
          printf '%s\n' '```sh' "echo $(printf 'x%.0s' {1..90})" '```' >> README.md
          git add --all

      - name: The action fails a repository with a wide example
        id: wide
        uses: ./actions/check-example-width
        continue-on-error: true
        with:
          root: ${{ runner.temp }}/fixture

      - name: Require the wide example to have failed the action
        if: steps.wide.outcome != 'failure'
        run: |
          echo "::error::The action ${{ steps.wide.outcome }} on a 90-column example."
          exit 1
